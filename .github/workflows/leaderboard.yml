name: Clan Leaderboard Update

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the leaderboard without posting or saving"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: clan-leaderboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Post clan leaderboard to Discord
        id: update
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python leaderboard.py --dry-run
          else
            python leaderboard.py
          fi
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run }}

      - name: Commit updated points state
        if: ${{ always() && steps.update.outcome != 'skipped' }}
        run: |
          git config user.name "clans-leaderboard-bot"
          git config user.email "clans-leaderboard-bot@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi
          git commit -m "Update clan leaderboard state [skip ci]"
          git push
